<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Happy Birthday Yashika ❤️</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">



  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

</head>
<body class="bg-black text-white overflow-hidden">

<!-- Aurora Background -->
<div id="background"></div>

<!-- Background Music -->
<audio id="music" loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<!-- PAGE 1 -->
<section class="page active" id="page1">

    <div class="glass-card">

        <h3>Hello 👋</h3>

        <h1>Yashika R</h1>

        <p>
            Someone made something special just for you...
        </p>

        <button class="nextBtn" data-next="page2">
            Start ❤️
        </button>

    </div>

</section>

<!-- PAGE 2 -->

<section class="page" id="page2">

    <h1 class="countdown">

        3

    </h1>

</section>

<!-- PAGE 3 -->

<div class="gift-box" id="gift">

    <div class="gift-lid"></div>

    <div class="gift-bow">
        <span></span>
        <span></span>
    </div>

    <div class="gift-ribbon vertical"></div>

    <div class="gift-ribbon horizontal"></div>

    <div class="gift-body"></div>

</div>

<!-- PAGE 4 -->

<section class="page" id="page4">

<div class="glass-card">

<h1>

Happy Birthday ❤️

</h1>

<h2>

Yashika R

</h2>

<p id="typing">

</p>

<button class="nextBtn"

data-next="page5">

Next →

</button>

</div>

</section>

<!-- PAGE 5 -->

<section class="page"

id="page5">

<h1>

Our Memories 📸

</h1>

<div class="gallery-grid">

<img src="images/photo1.jpg">

<img src="images/photo2.jpg">

<img src="images/photo3.jpg">

<img src="images/photo4.jpg">

<img src="images/photo5.jpg">

<img src="images/photo6.jpg">

</div>

<button class="nextBtn"

data-next="page6">

Next →

</button>

</section>

<!-- PAGE 6 -->

<section class="page"

id="page6">

<div class="letter-card">

<h1>

💌 Dear Yashika

</h1>

<p>

Your beautiful birthday letter
will come here...

</p>

</div>

<button class="nextBtn"

data-next="page7">

Next →

</button>

</section>

<!-- PAGE 7 -->

<section class="page"

id="page7">

<h2>

Make A Birthday Wish 🎂

</h2>

<div id="cake">

<div id="candle">

<div id="flame"></div>

</div>

</div>

<button id="blowBtn">

Blow Candle 🕯️

</button>

</section>

<!-- PAGE 8 -->

<section class="page"

id="page8">

<h1>

🎆

</h1>

<h2>

Happy Birthday

Yashika ❤️

</h2>

<p>

Thank you for being
my best friend.

❤️

</p>

<button id="replay">

Replay 🎁

</button>

</section>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

<script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

<script src="script.js"></script>

</body>

</html>
